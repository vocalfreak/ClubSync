# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

# In-process adapter, single app container. Nothing in the app broadcasts or
# subscribes today; this exists so ActionCable has a valid production config
# rather than nil. Switch to a real adapter (and a `cable` connection in
# database.yml) if a realtime feature is ever added.
# See docs/DEPLOYMENT_IMPLEMENTATION_PLAN.MD section 2.2.
production:
  adapter: async
